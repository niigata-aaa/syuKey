<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>
	<h1>ログイン</h1>
	<form action="login-servlet" method="POST">
		<!-- 10文字まで入力可能 -->
		ユーザID：<input type="text" name="user_id"required maxlength="10"><br>
		最大10文字までです<br>
		<!-- 8文字以上10文字の入力 -->
		パスワード：<input type="password" name="user_pass"required minlength="8" maxlength="10"><br>
		8文字以上10文字以下で入力してください<br>

		
		<input type="reset" value="クリア">
		<input type="submit" value="ログインする">
	</form>
</body>
</html>
