<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ログイン画面</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
	<img src="img/logo.png" alt="在庫見るくん">
	<h1>ログイン画面</h1>
	<form action="login-servlet" method="POST">
		<table>
		<tr>
			<td>ユーザID：</td>
			<td>
				<input type="text" name="user_id" required maxlength="10">
			</td>
		</tr>
		<tr>
			<td></td>
			<td><p>最大10文字までです</p></td>
		</tr>
		<tr>
			<td>パスワード：</td>
			<td>
				<input type="password"
				name="user_pass"
				required minlength="8">
			</td>
		</tr>
		<tr>
			<td></td>
			<td><p>8文字以上で入力してください</p></td>
		</tr>
		</table>
		<br>
		<input type="reset" value="クリア">
		
		
		<input type="submit" value="ログインする">
		
	</form>
</body>
</html>
